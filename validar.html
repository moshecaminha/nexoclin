<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validação de documento — NexoClin</title>
<style>
:root{--navy:#143A4E;--cyan:#146F8E;--green:#12996A;--line:#d7e5ec;--mist:#eef5f8;--ink:#22323a;--mute:#6a808c;--coral:#c0392b;--amber:#c07b12}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:#f6fafb;margin:0}
.wrap{max-width:480px;margin:0 auto;padding:26px 18px 60px}
.brand{display:flex;align-items:center;gap:8px;color:var(--navy);font-weight:800;font-size:20px;margin-bottom:14px}.brand b{color:var(--cyan)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(20,58,78,.05)}
.status{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.ic.ok{background:#e6f4ee;color:var(--green)}.ic.no{background:#fdecea;color:var(--coral)}.ic.wait{background:var(--mist);color:var(--cyan)}
.st-t{font-size:17px;font-weight:700;color:var(--navy)}.st-s{font-size:13px;color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--mist);font-size:13.5px}
.row:last-child{border-bottom:0}.row .l{color:var(--mute)}.row .v{color:var(--ink);font-weight:600;text-align:right;word-break:break-word}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.badge.sig{background:#e6f4ee;color:var(--green)}.badge.uns{background:#fff7e6;color:var(--amber)}
.foot{color:var(--mute);font-size:12px;text-align:center;margin-top:16px}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute);word-break:break-all}
.logo-img{height:34px;width:auto;display:block;max-width:70vw;object-fit:contain}</style></head><body>

<script>
const SB_URL="https://kzbazzwfdagfhyxuadqp.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YmF6endmZGFnZmh5eHVhZHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTYwMjUsImV4cCI6MjEwMjYzMjAyNX0.CembztJIxu21Q2WB6BV4iCGWLkYo8xXQW7Id35b3pyM";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const id=new URLSearchParams(location.search).get('d')||'';
const $=x=>document.getElementById(x);
const TIPOS={receita_simples:'Receita',receita_controle:'Receita de controle especial',atestado:'Atestado',exame_solicitacao:'Solicitação de exames',laudo:'Laudo',parecer:'Parecer técnico',relatorio:'Relatório médico',recomendacao:'Recomendações'};
function fmt(d){ try{ return new Date(d).toLocaleString('pt-BR'); }catch(e){ return d||''; } }
(async function(){ if(!id){ setNo('Link inválido','Sem identificador de documento.'); return; }
  try{ const {data,error}=await sb.rpc('nx_doc_verify',{p_doc:id}); if(error) throw error;
    if(!data||!data.ok){ setNo('Documento não encontrado','Não foi possível localizar este documento.'); return; }
    const assinado=data.assinado===true;
    $('ic').className='ic '+(assinado?'ok':'wait'); $('ic').textContent=assinado?'✓':'!';
    $('stT').textContent=assinado?'Documento autêntico e assinado':'Documento localizado';
    $('stS').textContent=assinado?('Assinatura digital · '+(data.provedor||'ICP-Brasil')):'Emitido — assinatura digital não registrada';
    const rows=[
      ['Tipo', TIPOS[data.tipo]||data.tipo],
      ['Número', data.numero||'—'],
      ['Emitido em', fmt(data.data)],
      ['Consultório', data.clinica||'—'],
      ['Resp. técnico', (data.responsavel||'—')+(data.crm?(' · '+data.crm):'')],
      ['Paciente', data.paciente_iniciais? (data.paciente_iniciais+' (iniciais)') : '—'],
      ['Situação', assinado?'<span class="badge sig">assinado</span>':'<span class="badge uns">emitido</span>']
    ];
    let html=rows.map(r=>`<div class="row"><span class="l">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('');
    if(data.hash){ html+=`<div class="row"><span class="l">Hash</span></div><div class="hash">${data.hash}</div>`; }
    $('details').innerHTML=html;
  }catch(e){ setNo('Erro na verificação','Tente novamente mais tarde.'); }
})();
function setNo(t,s){ $('ic').className='ic no'; $('ic').textContent='✕'; $('stT').textContent=t; $('stS').textContent=s; }
</script>
